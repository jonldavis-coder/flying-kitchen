name: Daily site rebuild

on:
  schedule:
    # 07:20 UTC, after the date has rolled in the calendar the build uses.
    - cron: "20 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install card fonts and Pillow
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          python3 -m pip install --user pillow
      - name: Rebuild the site
        run: node scripts/build-site.mjs
      - name: Commit when the date changes the pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The built site matches this commit."
            exit 0
          fi
          git commit -m "Kite Kitchen: daily rebuild"
          git push
